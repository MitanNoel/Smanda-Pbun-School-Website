<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Untitled design (1).png">
    <title>Album - SMA Negeri 2 Pangkalan Bun</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .header {
            background-color: #800000;
            color: #fff;
            padding: 10px 20px;
            display: flex;
            align-items: center;
        }
        .header a {
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .header a .icon {
            margin-right: 10px;
        }
        .title {
            text-align: center;
            margin: 20px 0;
            font-size: 24px;
            color: #800000;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
        }
        .gallery img {
            width: calc(100% / 6 - 20px);
            height: 150px;
            object-fit: cover;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }
        .pagination {
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .pagination a {
            margin: 0 5px;
            padding: 10px 20px;
            background-color: #800000;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .pagination a.active {
            background-color: #555;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.8);
        }
        .modal-content {
            position: relative;
            margin: auto;
            padding: 0;
            width: 80%;
            max-width: 700px;
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .modal-content img {
            width: 100%;
            height: auto;
            max-height: 60vh;
            object-fit: contain;
        }
        .close {
            position: absolute;
            color: #800000;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            bottom: 10px;
            right: 25px;
        }
        .description {
            padding: 20px;
            text-align: center;
            font-size: 18px;
            color: #800000;
            background-color: #f4f4f4;
            flex-grow: 1;
            overflow-y: auto;
        }
        .download {
            display: block;
            margin: 20px auto;
            font-size: 20px;
            background-color: #800000;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            text-align: center;
        }
        /* Mobile Layout */
        @media (max-width: 768px) {
            .gallery img {
                width: calc(100% / 2 - 20px);
                height: 100px;
            }
            .pagination a {
                padding: 5px 10px;
            }
            .download {
                font-size: 16px;
                padding: 5px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="https://sman2pbun.my.id">
            <span class="icon">&#8592;</span>
            Back to Main Page
        </a>
    </div>
    <h1 class="title">Album SMA Negeri 2 Pangkalan Bun</h1>
    <div class="gallery" id="gallery">
    </div>
    <div class="pagination">
        <a onclick="showPage(1)" class="active">1</a>
        <a onclick="showPage(2)">2</a>
        <a onclick="showPage(3)">3</a>
    </div>
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="modalImage" src="" alt="Full Image">
            <div class="description" id="description"></div>
            <a id="downloadLink" class="download" href="" download>Download</a>
        </div>
    </div>
    <script>
        const images = [
            { src: "Untitled design (1).png", description: "Description 1" },
            { src: "Untitled design (1).png", description: "Description 2" },
            { src: "Untitled design (1).png", description: "Description 3" },
            { src: "Untitled design (1).png", description: "Description 4" },
            { src: "Untitled design (1).png", description: "Description 5" },
            { src: "Untitled design (1).png", description: "Description 6" },
            { src: "Untitled design (1).png", description: "Description 7" },
            { src: "Untitled design (1).png", description: "Description 8" },
            { src: "Untitled design (1).png", description: "Description 9" },
            { src: "Untitled design (1).png", description: "Description 10" },
            { src: "Untitled design (1).png", description: "Description 11" },
            { src: "Untitled design (1).png", description: "Description 12" },
            { src: "Untitled design (1).png", description: "Description 13" },
            { src: "Untitled design (1).png", description: "Description 14" },
            { src: "Untitled design (1).png", description: "Description 15" },
            { src: "Untitled design (1).png", description: "Description 16" },
            { src: "Untitled design (1).png", description: "Description 17" },
            { src: "Untitled design (1).png", description: "Description 18" },
            { src: "Untitled design (1).png", description: "Description 19" },
            { src: "Untitled design (1).png", description: "Description 20" },
            { src: "Untitled design (1).png", description: "Description 21" },
            { src: "Untitled design (1).png", description: "Description 22" },
            { src: "Untitled design (1).png", description: "Description 23" },
            { src: "Untitled design (1).png", description: "Description 24" },
            { src: "Untitled design (1).png", description: "Description 25" },
            { src: "Untitled design (1).png", description: "Description 26" },
            { src: "Untitled design (1).png", description: "Description 27" },
            { src: "Untitled design (1).png", description: "Description 28" },
            { src: "Untitled design (1).png", description: "Description 29" },
            { src: "Untitled design (1).png", description: "Description 30" }
        ];

        function showPage(page) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            const start = (page - 1) * 18;
            const end = start + 18;
            const pageImages = images.slice(start, end);
            pageImages.forEach(image => {
                const img = document.createElement('img');
                img.src = image.src;
                img.alt = 'Album Image';
                img.onclick = () => openModal(image);
                gallery.appendChild(img);
            });

            document.querySelectorAll('.pagination a').forEach(a => a.classList.remove('active'));
            document.querySelectorAll('.pagination a')[page - 1].classList.add('active');
        }

        function openModal(image) {
            const modal = document.getElementById('myModal');
            const modalImage = document.getElementById('modalImage');
            const downloadLink = document.getElementById('downloadLink');
            const description = document.getElementById('description');
            modal.style.display = "block";
            modalImage.src = image.src;
            downloadLink.href = image.src;
            description.innerText = image.description;
        }

        document.querySelector('.close').onclick = function() {
            document.getElementById('myModal').style.display = "none";
        }

        window.onclick = function(event) {
            const modal = document.getElementById('myModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        showPage(1);
    </script>
</body>
</html>
